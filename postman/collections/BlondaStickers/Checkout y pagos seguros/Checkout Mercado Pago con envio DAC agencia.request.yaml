$kind: http-request
description: El backend calcula shippingCost=240 desde shippingOption, lo incluye como item cobrable y crea preferencia Mercado Pago.
url: "{{base_url}}/api/orders/checkout"
method: POST
headers:
  Content-Type: application/json
  Cookie: "{{clientCookie}}"
body:
  type: text
  content: |-
    {
      "deliveryType": "SHIPPING",
      "shippingOption": "DAC_AGENCY",
      "addressId": "{{addressId}}",
      "paymentProvider": "MERCADO_PAGO"
    }
order: 1000
