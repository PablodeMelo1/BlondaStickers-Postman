$kind: http-request
description: Debe responder 400 porque transferBank solo acepta ITAU, MI_DINERO o MERCADO_PAGO.
url: "{{base_url}}/api/orders/checkout"
method: POST
headers:
  Content-Type: application/json
  Cookie: "{{clientCookie}}"
body:
  type: text
  content: |-
    {
      "deliveryType": "PICKUP",
      "paymentProvider": "TRANSFER",
      "transferBank": "BROU"
    }
order: 6000
