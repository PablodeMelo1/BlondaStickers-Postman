$kind: http-request
url: "{{baseUrl}}/api/categories"
method: POST
headers:
  Content-Type: application/json
  Cookie: "{{adminCookie}}"
body:
  type: text
  content: |-
    {
      "name": " "
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('missing name returns 400', function () {
        pm.response.to.have.status(400);
      });
    language: text/javascript
order: 3000
