$kind: http-request
url: "{{baseUrl}}/api/categories/{{categoryId}}/visibility"
method: PATCH
headers:
  Cookie: "{{adminCookie}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('visibility is toggled', function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 12000
