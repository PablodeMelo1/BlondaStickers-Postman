$kind: http-request
url: "{{baseUrl}}/api/categories"
method: POST
headers:
  Content-Type: application/json
  Cookie: "{{adminCookie}}"
body:
  type: text
  content: |-
    {
      "name": "Invalid Visibility",
      "visibleInMenu": "yes"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('invalid visibleInMenu returns 400', function () {
        pm.response.to.have.status(400);
      });
    language: text/javascript
order: 6000
