$kind: http-request
url: "{{baseUrl}}/api/categories/{{missingCategoryId}}"
method: PATCH
headers:
  Content-Type: application/json
  Cookie: "{{adminCookie}}"
body:
  type: text
  content: |-
    {
      "name": "Missing Category"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('missing category returns 404', function () {
        pm.response.to.have.status(404);
      });
    language: text/javascript
order: 11000
