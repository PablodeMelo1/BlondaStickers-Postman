$kind: http-request
url: "{{baseUrl}}/api/categories/invalid-id"
method: PATCH
headers:
  Content-Type: application/json
  Cookie: "{{adminCookie}}"
body:
  type: text
  content: |-
    {
      "name": "Should Not Update"
    }
scripts:
