$kind: http-request
url: "{{baseUrl}}/api/categories/{{missingCategoryId}}/visibility"
method: PATCH
headers:
  Cookie: "{{adminCookie}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('missing category returns 404', function () {
        pm.response.to.have.status(404);
      });
    language: text/javascript
order: 14000
