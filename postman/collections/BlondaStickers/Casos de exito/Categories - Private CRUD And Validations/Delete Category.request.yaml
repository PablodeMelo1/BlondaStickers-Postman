$kind: http-request
url: "{{baseUrl}}/api/categories/{{categoryId}}"
method: DELETE
headers:
  Cookie: "{{adminCookie}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('category is deleted', function () {
        pm.response.to.have.status(204);
      });
    language: text/javascript
order: 18000
