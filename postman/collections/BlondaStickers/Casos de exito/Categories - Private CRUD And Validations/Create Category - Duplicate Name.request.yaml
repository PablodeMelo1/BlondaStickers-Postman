$kind: http-request
url: "{{baseUrl}}/api/categories"
method: POST
headers:
  Content-Type: application/json
  Cookie: "{{adminCookie}}"
body:
  type: text
  content: |-
    {
      "name": "{{categoryName}}",
      "description": "Duplicate category"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('duplicate name returns 409', function () {
        pm.response.to.have.status(409);
      });
    language: text/javascript
order: 7000
