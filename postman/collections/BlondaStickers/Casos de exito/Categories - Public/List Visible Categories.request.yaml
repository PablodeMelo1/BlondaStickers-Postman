$kind: http-request
url: "{{baseUrl}}/api/categories/visible"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('public list returns 200', function () {
        pm.response.to.have.status(200);
      });

      pm.test('response is an array', function () {
        pm.expect(pm.response.json()).to.be.an('array');
      });
    language: text/javascript
order: 1000
