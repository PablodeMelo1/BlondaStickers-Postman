$kind: http-request
description: Agrega un item ya personalizado. Si la variante es fisica, debe haber stock suficiente.
url: "{{base_url}}/api/cart/items"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "productId": "{{productId}}",
      "variantId": "{{variantId}}",
      "quantity": 1,
      "customization": {
        "notes": "Usar logo enviado por WhatsApp",
        "fields": {
          "Texto": "Blonda",
          "Color": "Rosa"
        }
      }
    }
order: 4000
