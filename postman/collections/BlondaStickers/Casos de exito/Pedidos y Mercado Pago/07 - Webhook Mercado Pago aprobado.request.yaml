$kind: http-request
description: Simula el webhook. El backend consulta el pago real y confirma o cancela la orden.
url: "{{base_url}}/api/payments/mercadopago/webhook"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "type": "payment",
      "data": {
        "id": "{{paymentId}}"
      }
    }
order: 8000
