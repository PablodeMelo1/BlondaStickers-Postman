$kind: http-request
url: "{{base_url}}/api/cart/items"
method: POST
headers:
  Content-Type: application/json
  Cookie: "{{clientCookie}}"
body:
  type: text
  content: |-
    {
      "productId": "507f1f77bcf86cd799439011",
      "variantId": "{{variantId}}",
      "quantity": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('producto inexistente retorna 404', function () {
        pm.response.to.have.status(404);
      });
    language: text/javascript
order: 7000
