$kind: http-request
url: "{{base_url}}/api/cart/items"
method: POST
headers:
  Content-Type: application/json
  Cookie: "{{clientCookie}}"
body:
  type: text
  content: |-
    {
      "productId": "{{productId}}",
      "variantId": "507f1f77bcf86cd799439999",
      "quantity": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('variante incorrecta retorna 400', function () {
        pm.response.to.have.status(400);
      });
    language: text/javascript
order: 8000
