$kind: http-request
url: "{{base_url}}/api/cart/items"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "productId": "{{productId}}",
      "variantId": "{{variantId}}",
      "quantity": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('sin autenticación retorna 401', function () {
        pm.response.to.have.status(401);
      });
    language: text/javascript
settings:
  disableCookies: true
order: 2000
