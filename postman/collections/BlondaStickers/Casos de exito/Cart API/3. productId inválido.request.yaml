$kind: http-request
url: "{{base_url}}/api/cart/items"
method: POST
headers:
  Content-Type: application/json
  Cookie: "{{clientCookie}}"
body:
  type: text
  content: |-
    {
      "productId": "invalido",
      "variantId": "{{variantId}}",
      "quantity": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('productId inválido retorna 400', function () {
        pm.response.to.have.status(400);
      });
    language: text/javascript
order: 3000
